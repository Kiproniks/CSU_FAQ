<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Верификация</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f1f5f9; margin: 0; }
    .wrap { max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 16px; }
    input, button { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #cbd5e1; }
    button { background: #0f766e; color: #fff; border: 0; font-weight: 600; cursor: pointer; }
    .ok { color: #0f766e; font-weight: 600; }
    .error { color: #b91c1c; font-weight: 600; }
    a { color: #0f172a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Верификация пользователя</h2>
      <p>Вставьте токен, выданный в Telegram или админом.</p>
      <form method="post">
        <input name="token" placeholder="Введите токен" />
        <button type="submit">Проверить токен</button>
      </form>
      {% if message %}
      <p class="{{ 'ok' if status == 'ok' else 'error' }}">{{ message }}</p>
      {% endif %}
      <p><a href="/">Назад к поиску</a></p>
    </div>
  </div>
</body>
</html>
